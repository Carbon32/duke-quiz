spring.application.name=quiz
server.port=8081

spring.datasource.url=jdbc:postgresql://localhost:5432/quiz_db
spring.datasource.username=postgres
spring.datasource.password=carbon123
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Gopher Auth API, don't touch this unless you know what you're doing
# You can replace it with your own authentication API but this project is designed around
# the use of Gopher Auth, so your endpoints and the mechanism need to map perfectly to Gopher Auth's
# endpoints and mechanism or things won't work as expected
auth.api.base-url=${AUTH_API_BASE_URL:http://127.0.0.1:8080}